<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Tuk-Tuk / Three Wheeler Silhouette -->
  <g transform="translate(64, 80) scale(0.75)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabin Roof & Windshield -->
    <path d="M 80 260 L 130 110 L 360 110 C 400 110 430 140 430 180 L 430 330 L 70 330 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" />
    <path d="M 130 110 L 170 210 L 290 210 L 290 110" stroke="url(#gold)" stroke-width="20" />
    <!-- Rear Cabin -->
    <path d="M 290 110 L 420 120 L 440 260 L 320 260" stroke="#ffffff" />
    <!-- Front Wheel -->
    <circle cx="100" cy="380" r="44" fill="#064e3b" stroke="url(#gold)" stroke-width="22"/>
    <circle cx="100" cy="380" r="14" fill="#fbbf24"/>
    <!-- Rear Wheels -->
    <circle cx="370" cy="380" r="44" fill="#064e3b" stroke="url(#gold)" stroke-width="22"/>
    <circle cx="370" cy="380" r="14" fill="#fbbf24"/>
    <!-- Chassis Bar -->
    <line x1="144" y1="380" x2="326" y2="380" stroke="#ffffff" stroke-width="20"/>
    <!-- Fuel Drop Emblem inside -->
    <path d="M 360 210 C 360 190 380 160 380 160 C 380 160 400 190 400 210 C 400 222 391 232 380 232 C 369 232 360 222 360 210 Z" fill="#fbbf24" stroke="none" />
  </g>
  <!-- Text Badge -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="3">FUELSHARE</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">SRI LANKA • LKR</text>
</svg>
